<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CRE Valuate Pro — Demo Client</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;background:#0b1220;color:#fff;padding:20px}
    .card{background:#0f1724;padding:18px;border-radius:10px;max-width:900px;margin:10px auto}
    input,button{padding:8px;border-radius:6px;border:1px solid #243044;background:#071027;color:#fff}
    .row{display:flex;gap:10px}
    #paywall{background:rgba(10,15,25,0.9);padding:16px;border-radius:8px;margin-top:12px}
    a { color: #7c9cff; }
  </style>
</head>
<body>
  <div class="card">
    <h2>CRE Valuate Pro — Demo Client</h2>

    <div id="authSection">
      <p>Demo login: <strong>test@example.com</strong> / <strong>password</strong></p>
      <div class="row">
        <input id="email" value="test@example.com">
        <input id="password" value="password" type="password">
        <button onclick="login()">Login</button>
      </div>
      <div style="margin-top:8px;"><button onclick="logout()">Logout</button></div>
      <div id="loginStatus"></div>
    </div>

    <hr style="border-color:#203044">

    <div>
      <label>Company / Brokerage Name</label>
      <input id="companyName" placeholder="Apex Commercial Realty" style="width:100%;margin-bottom:8px">
      <label>Upload Company Logo</label>
      <input id="logoFile" type="file" accept="image/*">
      <div id="logoPreview" style="margin-top:8px"></div>
      <button onclick="uploadLogo()">Upload Logo to Server</button>
    </div>

    <hr style="border-color:#203044">

    <div>
      <label>Property Name / Address</label>
      <input id="propName" value="Oakridge Commercial Center" style="width:100%;margin-bottom:8px">
      <label>Purchase Price ($)</label>
      <input id="purchasePrice" type="number" value="2500000">
      <div style="margin-top:8px">
        <button onclick="createCheckout()">Unlock White-Label Export (Subscribe)</button>
        <button onclick="downloadPdf()" style="margin-left:8px">Export Branded Investment Memo (PDF)</button>
      </div>
    </div>

    <div id="paywall" style="display:block">
      <h3>Paywall: Exports locked</h3>
      <p>After subscribing (demo), the server will mark you as paid and you can export branded PDFs.</p>
    </div>

    <div id="meInfo" style="margin-top:12px;color:#94a3b8"></div>
  </div>

<script>
  // API base (set to your backend URL when deploying)
  const API_BASE = (window.__API_BASE__ && window.__API_BASE__) || (window.location.origin.replace(/:3000$/, ':4242'));

  let token = localStorage.getItem('cvp_token') || null;

  async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const res = await fetch(API_BASE + '/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    if (!res.ok) { alert('Login failed'); return; }
    const data = await res.json();
    token = data.token;
    localStorage.setItem('cvp_token', token);
    document.getElementById('loginStatus').innerText = 'Logged in';
    await refreshMe();
  }

  function logout() {
    token = null;
    localStorage.removeItem('cvp_token');
    document.getElementById('loginStatus').innerText = 'Logged out';
    document.getElementById('meInfo').innerText = '';
    document.getElementById('paywall').style.display = 'block';
  }

  async function refreshMe() {
    if (!token) return;
    const res = await fetch(API_BASE + '/me', { headers: { Authorization: 'Bearer ' + token }});
    if (!res.ok) { logout(); return; }
    const me = await res.json();
    document.getElementById('meInfo').innerText = `User: ${me.email} — Paid: ${me.paid ? 'Yes' : 'No'}`;
    document.getElementById('paywall').style.display = me.paid ? 'none' : 'block';
    if (me.logoUrl) document.getElementById('logoPreview').innerHTML = `<img src="${me.logoUrl}" style="max-height:60px">`;
  }

  async function uploadLogo() {
    if (!token) { alert('Please log in first'); return; }
    const fileInput = document.getElementById('logoFile');
    if (!fileInput.files || fileInput.files.length === 0) return alert('Select a file');
    const file = fileInput.files[0];
    const form = new FormData();
    form.append('logo', file);
    const res = await fetch(API_BASE + '/upload-logo', { method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: form });
    if (!res.ok) { const err = await res.json().catch(()=>{}); alert('Upload failed: ' + (err && err.error ? err.error : res.statusText)); return; }
    const data = await res.json();
    document.getElementById('logoPreview').innerHTML = `<img src="${data.url}" style="max-height:60px">`;
    await refreshMe();
  }

  async function createCheckout() {
    if (!token) { alert('Please log in first'); return; }
    const res = await fetch(API_BASE + '/create-checkout-session', { method: 'POST', headers: { Authorization: 'Bearer ' + token }});
    if (!res.ok) { alert('Failed to create checkout session'); return; }
    const data = await res.json();
    if (data.url) { window.location.href = data.url; return; }
    alert('Checkout session created — open the returned session URL in response.');
  }

  async function downloadPdf() {
    if (!token) { alert('Please log in first'); return; }
    const title = document.getElementById('propName').value || 'Property Memo';
    const res = await fetch(API_BASE + '/generate-pdf?title=' + encodeURIComponent(title), { headers: { Authorization: 'Bearer ' + token }});
    if (res.status === 403) { alert('Subscription required to export PDF. Please subscribe first.'); return; }
    if (!res.ok) { alert('Failed to generate PDF.'); return; }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'investment-memo.pdf';
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }

  (async () => { if (token) await refreshMe(); })();
</script>
</body>
</html>
