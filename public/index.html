<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRE Valuate Pro — Investment Memo Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
      padding: 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 28px;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .header p {
      color: #64748b;
      font-size: 14px;
    }

    .auth-section, .dashboard-section {
      display: none;
    }

    .auth-section.active, .dashboard-section.active {
      display: block;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #0f172a;
    }

    input[type='email'],
    input[type='password'],
    input[type='text'],
    input[type='file'],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    input[type='email']:focus,
    input[type='password']:focus,
    input[type='text']:focus,
    input[type='file']:focus,
    textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #5568d3;
    }

    button:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }

    .toggle-auth {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: #64748b;
    }

    .toggle-auth a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .error, .success {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }

    .user-info {
      background: #f8fafc;
      padding: 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .user-info p {
      color: #0f172a;
      margin-bottom: 8px;
    }

    .user-info strong {
      color: #0f172a;
      font-weight: 600;
    }

    .logo-preview {
      width: 60px;
      height: 60px;
      margin-top: 8px;
      border-radius: 4px;
      background: white;
      border: 1px solid #e2e8f0;
      object-fit: contain;
      padding: 4px;
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .button-group button {
      flex: 1;
    }

    .button-secondary {
      background: #e2e8f0;
      color: #0f172a;
    }

    .button-secondary:hover {
      background: #cbd5e1;
    }

    .pricing-info {
      background: #f0f4ff;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #3730a3;
      border: 1px solid #c7d2fe;
    }

    .loading {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #e2e8f0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 6px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>💼 CRE Valuate Pro</h1>
      <p>Generate branded investment memos</p>
    </div>

    <!-- AUTH SECTION -->
    <div class="auth-section active">
      <div id="authMessage"></div>

      <!-- LOGIN TAB -->
      <div id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" />
        </div>
        <button onclick="login()">Sign In</button>
        <div class="toggle-auth">
          Don't have an account? <a onclick="toggleAuthMode()">Register</a>
        </div>
      </div>

      <!-- REGISTER TAB -->
      <div id="registerForm" style="display: none">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="registerEmail" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="registerPassword" placeholder="••••••••" />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="registerConfirm" placeholder="••••••••" />
        </div>
        <button onclick="register()">Create Account</button>
        <div class="toggle-auth">
          Already have an account? <a onclick="toggleAuthMode()">Sign In</a>
        </div>
      </div>
    </div>

    <!-- DASHBOARD SECTION -->
    <div class="dashboard-section">
      <div id="dashMessage"></div>

      <div class="user-info">
        <p>
          Logged in as <strong id="userEmail"></strong>
        </p>
        <p id="paidStatus" style="color: #059669; font-weight: 600;"></p>
        <div id="logoSection"></div>
      </div>

      <!-- PDF GENERATION FORM -->
      <div id="pdfSection">
        <div class="form-group">
          <label>Memo Title</label>
          <input type="text" id="memoTitle" placeholder="e.g., Downtown Office Building Investment" value="Investment Memo" />
        </div>
        <button onclick="generatePDF()">📄 Generate PDF</button>
      </div>

      <!-- LOGO UPLOAD & SUBSCRIPTION -->
      <div id="subscriptionSection">
        <div class="pricing-info">
          💎 Subscribe to unlock PDF exports with your branding
        </div>
        <div class="form-group">
          <label>Upload Logo</label>
          <input type="file" id="logoFile" accept="image/*" />
        </div>
        <button onclick="uploadLogo()">Upload Logo</button>
        <button class="button-secondary" onclick="checkout()">Subscribe to Unlock PDF</button>
      </div>

      <div class="button-group">
        <button class="button-secondary" onclick="logout()">Sign Out</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin; // Auto-detect backend URL

    // ==== AUTH STATE ====
    let token = localStorage.getItem('token');
    let user = null;

    // ==== INIT ====
    window.addEventListener('DOMContentLoaded', () => {
      if (token) {
        showDashboard();
        loadUser();
      } else {
        showAuth();
      }
    });

    // ==== AUTH FLOW ====
    async function login() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      if (!email || !password) {
        showAuthMessage('Email and password required', 'error');
        return;
      }

      try {
        const res = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        token = data.token;
        localStorage.setItem('token', token);
        showDashboard();
        loadUser();
      } catch (err) {
        showAuthMessage(err.message, 'error');
      }
    }

    async function register() {
      const email = document.getElementById('registerEmail').value.trim();
      const password = document.getElementById('registerPassword').value.trim();
      const confirm = document.getElementById('registerConfirm').value.trim();

      if (!email || !password || !confirm) {
        showAuthMessage('All fields required', 'error');
        return;
      }
      if (password !== confirm) {
        showAuthMessage('Passwords do not match', 'error');
        return;
      }
      if (password.length < 6) {
        showAuthMessage('Password must be at least 6 characters', 'error');
        return;
      }

      try {
        const res = await fetch(`${API_URL}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Registration failed');

        token = data.token;
        localStorage.setItem('token', token);
        showDashboard();
        loadUser();
      } catch (err) {
        showAuthMessage(err.message, 'error');
      }
    }

    function logout() {
      token = null;
      user = null;
      localStorage.removeItem('token');
      showAuth();
      document.getElementById('loginEmail').value = '';
      document.getElementById('loginPassword').value = '';
    }

    function toggleAuthMode() {
      document.getElementById('loginForm').style.display = document.getElementById('loginForm').style.display === 'none' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = document.getElementById('registerForm').style.display === 'none' ? 'block' : 'none';
      document.getElementById('authMessage').innerHTML = '';
    }

    // ==== DASHBOARD ====
    async function loadUser() {
      try {
        const res = await fetch(`${API_URL}/me`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to load user');

        user = data;
        document.getElementById('userEmail').textContent = user.email;

        if (user.paid) {
          document.getElementById('paidStatus').textContent = '✅ Subscription Active';
          document.getElementById('subscriptionSection').style.display = 'none';
          document.getElementById('pdfSection').style.display = 'block';
        } else {
          document.getElementById('paidStatus').textContent = '⏳ Free Plan';
          document.getElementById('subscriptionSection').style.display = 'block';
          document.getElementById('pdfSection').style.display = 'none';
        }

        if (user.logoUrl) {
          document.getElementById('logoSection').innerHTML = `<div>📷 Logo:<br/><img src="${user.logoUrl}" class="logo-preview" alt="Logo" /></div>`;
        }
      } catch (err) {
        showDashMessage(err.message, 'error');
      }
    }

    async function uploadLogo() {
      const file = document.getElementById('logoFile').files[0];
      if (!file) {
        showDashMessage('Please select a file', 'error');
        return;
      }

      const formData = new FormData();
      formData.append('logo', file);

      try {
        const res = await fetch(`${API_URL}/upload-logo`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` },
          body: formData
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Upload failed');

        showDashMessage('Logo uploaded!', 'success');
        document.getElementById('logoFile').value = '';
        loadUser();
      } catch (err) {
        showDashMessage(err.message, 'error');
      }
    }

    async function generatePDF() {
      const title = document.getElementById('memoTitle').value || 'Investment Memo';
      if (!user.paid) {
        showDashMessage('Subscription required', 'error');
        return;
      }

      const btn = event.target;
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span>Generating...';

      try {
        const res = await fetch(`${API_URL}/generate-pdf?title=${encodeURIComponent(title)}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('PDF generation failed');

        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'investment-memo.pdf';
        a.click();
        window.URL.revokeObjectURL(url);

        showDashMessage('PDF downloaded!', 'success');
      } catch (err) {
        showDashMessage(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '📄 Generate PDF';
      }
    }

    async function checkout() {
      try {
        const res = await fetch(`${API_URL}/create-checkout-session`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Checkout failed');

        if (data.url) {
          window.location.href = data.url;
        } else {
          showDashMessage('Stripe not configured', 'error');
        }
      } catch (err) {
        showDashMessage(err.message, 'error');
      }
    }

    // ==== UI HELPERS ====
    function showAuth() {
      document.querySelector('.auth-section').classList.add('active');
      document.querySelector('.dashboard-section').classList.remove('active');
    }

    function showDashboard() {
      document.querySelector('.auth-section').classList.remove('active');
      document.querySelector('.dashboard-section').classList.add('active');
    }

    function showAuthMessage(msg, type) {
      const el = document.getElementById('authMessage');
      el.className = type;
      el.textContent = msg;
    }

    function showDashMessage(msg, type) {
      const el = document.getElementById('dashMessage');
      el.className = type;
      el.textContent = msg;
    }
  </script>
</body>
</html>
