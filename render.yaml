# Render Infrastructure as Code (Infrastructure)
# Deploy this to Render for automated setup
# Usage: push to GitHub, Render will auto-deploy

services:
  - type: web
    name: cre-valuate-pro-backend
    env: node
    plan: standard
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 4242
      - key: NODE_ENV
        value: production
      - key: STRIPE_SECRET_KEY
        sync: false  # Set manually in Render dashboard
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PRICE_ID
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cre-valuate-pro-db
          property: connectionString

  - type: pserv
    name: cre-valuate-pro-db
    plan: free
    ipAllowList: []  # Allow all IPs (or restrict by env var)

databases:
  - name: cre-valuate-pro-db
    plan: free
    postgresVersion: "14"
